name: Benchmark

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write

jobs:
  benchmark:
    name: Run redis-benchmark
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: cargo build --release

      - name: Install Redis Tools & Stock Redis
        run: sudo apt-get update && sudo apt-get install -y redis-tools redis-server

      - name: Start Rudis Server
        run: |
          ./target/release/rudisd --addr 127.0.0.1:6380 --aof false &
          sleep 3

      - name: Start Stock Redis Server
        run: |
          redis-server --daemonize yes
          sleep 3

      - name: Benchmark Rudis
        run: |
          redis-benchmark -p 6380 -q -n 100000 -t ping,set,get,incr,lpush,rpush,lpop,rpop > rudis_benchmark.txt

      - name: Benchmark Stock Redis
        run: |
          redis-benchmark -p 6379 -q -n 100000 -t ping,set,get,incr,lpush,rpush,lpop,rpop > stock_benchmark.txt

      - name: Clean up data
        run: |
          tr '\r' '\n' < stock_benchmark.txt > stock_clean.txt
          tr '\r' '\n' < rudis_benchmark.txt > rudis_clean.txt

      - name: Convert benchmark to JSON
        run: |
          awk -F': ' '/requests per second/ {
              name = $1; gsub(/^[[:space:]]+|[[:space:]]+$/, "", name);
              if (match($2, /[0-9]+(\.[0-9]+)?/)) val = substr($2, RSTART, RLENGTH); else val = 0;
              print name, val
          }' stock_clean.txt > stock_parsed.txt

          awk -F': ' '/requests per second/ {
              name = $1; gsub(/^[[:space:]]+|[[:space:]]+$/, "", name);
              if (match($2, /[0-9]+(\.[0-9]+)?/)) val = substr($2, RSTART, RLENGTH); else val = 0;
              print name, val
          }' rudis_clean.txt > rudis_parsed.txt

          awk 'NR==FNR {stock[$1]=$2; next}
            {
              if ($1 in stock && stock[$1] != 0) {
                ratio = ($2 / stock[$1]) * 100;
              } else {
                ratio = 0;
              }
              printf "{\"name\":\"%s ratio\", \"value\": %.2f},\n", $1, ratio
            }' stock_parsed.txt rudis_parsed.txt > ratios_raw.txt

          sed '$ s/,$//' ratios_raw.txt > ratios_clean.txt
          echo '[' > benchmark_output.json
          cat ratios_clean.txt >> benchmark_output.json
          echo ']' >> benchmark_output.json

      - name: Check JSON
        run: cat benchmark_output.json

      - name: Store Benchmark Result
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Redis Clone Performance
          tool: 'customBiggerIsBetter'
          output-file-path: benchmark_output.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
          # alert if performance drops by more than 80%
          alert-threshold: '80%'
          comment-on-alert: true
          fail-on-alert: false
          alert-comment-cc-users: '@gxnda'
