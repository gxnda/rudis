[package]
name = "rudis"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rudisd"
path = "src/bin/main.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
ahash = "0.8.12"
atoi = "3.1.0"
bincode = {version="2.0.1", features=["serde"]}
bytes = {version="1.10.1", features=["serde"]}
clap = { version = "4.5.45", features = ["derive"] }
coarsetime = "0.1.37"
crossbeam-skiplist = "0.1.3"
dashmap = {version="6.1.0", features=["rayon", "serde"]}
memchr = "2.8.3"
rayon = "1.10.0"
regex = "1.11.1"
serde = {version="1.0.219", features=["derive"]}
tempfile = "3.20.0"
thiserror = "2.0.12"
tokio = { version = "1.47.1", features = ["full"]}
tokio-util = "0.7.16"
tracing = "0.1.41"

[dev-dependencies]
criterion = "0.5"
rand = "0.8"
lazy_static = "1.4"

[[bench]]
name = "resp_parsing"
harness = false

[[bench]]
name = "storage_operations"
harness = false

[[bench]]
name = "data_structures"
harness = false

[[bench]]
name = "expiry_operations"
harness = false

[[bench]]
name = "concurrency"
harness = false

